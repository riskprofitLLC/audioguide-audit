# Линтер и правила анализа для Flutter-проекта.
# Подключённые наборы правил: flutter_lints (базовый).

include: package:flutter_lints/flutter.yaml

linter:
  rules:
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
    avoid_print: true
    use_key_in_widget_constructors: true
    unawaited_futures: true
    cancel_subscriptions: true
    close_sinks: true
    avoid_dynamic_calls: true

analyzer:
  # Q2: строгие режимы включены — кодовая база под ними чиста
  # (0 ошибок/предупреждений при включении; см. историю коммитов).
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    todo: ignore
    avoid_print: warning
    invalid_annotation_target: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
