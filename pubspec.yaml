name: island_guide
description: Offline tourist guide for islands.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  go_router: ^18.0.0

  maplibre_gl: ^0.26.2

  http: ^1.6.0
  geolocator: ^14.0.2
  just_audio: ^0.10.4
  # Фоновое воспроизведение и медиа-уведомление (28-й проход):
  # без него Android глушит плеер при уходе приложения в фон,
  # а на lock screen нет контролов. В офлайн-кеше пакета нет —
  # затянут вручную в ~/.pub-cache (см. AGENTS.md про pub.dev).
  just_audio_background: ^0.0.1-beta.17
  mobile_scanner: ^7.4.2
  video_player: ^2.9.5

  sqlite3: ^3.5.0

  path: ^1.9.0
  path_provider: ^2.1.5
  xml: ^7.0.1
  share_plus: ^10.0.0
  flex_color_scheme: ^8.4.0
  smooth_page_indicator: ^2.0.1
  lucide_icons_flutter: ^3.1.15
  pointer_interceptor: ^0.10.1+2
  web: ^1.1.1

dev_dependencies:

  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Явная зависимость тестов (баг 14, замечания Sonnet):
  # test/location_service_test.dart импортирует fake_async напрямую
  # (FakeAsync/pumpEventQueue), без объявления это работало только
  # как transitive от flutter_test. Версия — из pubspec.lock (offline).
  fake_async: 1.3.3

flutter:

  uses-material-design: true

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope/Manrope-Variable.ttf
    - family: Prata
      fonts:
        - asset: assets/fonts/Prata/Prata-Regular.ttf

